name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update -y || true
        sudo apt-get install -y --no-install-recommends \
          build-essential libffi-dev python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mix-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev openjdk-17-jdk zip unzip
        pip install --upgrade pip setuptools buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: OSCAN-APK
        path: bin/*.apk
