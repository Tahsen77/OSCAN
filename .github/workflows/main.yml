To build Kivy Android applications using Buildozer in GitHub Actions, use community-maintained, actively supported actions such as `ArtemShtepenko/buildozer-action` or `action-buildozer`.

Here is a complete, working GitHub Actions workflow (`.github/workflows/build.yml`) using `ArtemShtepenko/buildozer-action`:

```yaml
name: Build Kivy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemShtepenko/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          subfolder: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}
